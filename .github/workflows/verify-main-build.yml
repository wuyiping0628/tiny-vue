name: Verify Main Repository Build

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  verify-main-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
    - uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SUBMODULE_SSH_KEY }}
    - name: Checkout submodule repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT_TOKEN }}

    - name: Checkout main repository
      run: |
        # 克隆主仓库
        git clone https://github.com/wuyiping0628/next-docs.git docs
        cd docs
        
        # 更新子模块到PR分支的版本
        git submodule sync --recursive
        git submodule update --init --recursive
        cd ./tiny-vue
        
        # 获取PR分支的最新提交
        git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-branch
        git checkout pr-branch
        
        # 回到主仓库根目录
        cd ../
        
        # 更新主仓库中的子模块引用
        git add tiny-vue
        git commit -m "Update submodule to PR version" || echo "No changes"
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Install deps
      run: pnpm i
    - name: Build site
      run: |
        echo "当前目录："
        pwd
        echo "目录内容："
        ls -la
        echo "进入 docs 目录并构建..."
        cd docs && pnpm build
        
    - name: Update PR status
      if: always()
      run: |
        # 检查构建是否成功
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ 主仓库构建成功"
        else
          echo "❌ 主仓库构建失败"
          exit 1
        fi
